<% require "dotenv"; Dotenv.load(".env") %>

service: linkboard
image: <%= ENV['REGISTRY_USERNAME'] %>/linkboard
servers:
  - <%= ENV['SERVER_IP'] %>

proxy:
  ssl: true
  host: <%= ENV['APP_DOMAIN'] %>

registry:
  server: ghcr.io
  username:
    - REGISTRY_USERNAME
  password:
    - REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64

env:
  secret:
    - SESSION_SECRET_KEY

volumes:
  - "/root/linkboard:/app/db.sqlite"
  - "/root/linkboard:/app/db.sqlite-shm"
  - "/root/linkboard:/app/db.sqlite-wal"
