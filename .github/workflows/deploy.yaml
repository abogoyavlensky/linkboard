name: Deploy

on:
  push:
    branches: [ master ]

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    needs: [ checks ]
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: jdx/mise-action@v4
        with:
          install_args: "uc"

      # The default docker driver can't export cache (type=gha); this sets up
      # a docker-container builder that can.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      # Exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL to the `uc` run step
      # so the gha cache backend can authenticate.
      - name: Expose GitHub Runtime for cache
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and deploy
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uc --context personal --connect root@${{ vars.SERVER_IP }} deploy -f compose.yaml --yes linkboard-app
