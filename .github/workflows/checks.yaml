name: Checks

on:
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "babashka cljfmt"
      - name: Fmt
        run: bb fmt:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cache-clojure-deps
      - uses: jdx/mise-action@v2
        with:
          install_args: "babashka clj-kondo java clojure"
      - name: Lint
        run: bb deps && bb lint:init && bb lint

