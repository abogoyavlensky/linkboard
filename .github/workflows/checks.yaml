name: Checks

on:
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "babashka cljfmt"
      - name: Fmt
        run: bb fmt:check


