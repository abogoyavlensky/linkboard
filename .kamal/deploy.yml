<% require "dotenv"; Dotenv.load(".env") %>

service: linkboard
image: <%= ENV['REGISTRY_USERNAME'] %>/linkboard
servers:
  - <%= ENV['SERVER_IP'] %>

proxy:
  ssl: true
  host: <%= ENV['APP_DOMAIN'] %>

registry:
  server: ghcr.io
  username:
    - REGISTRY_USERNAME
  password:
    - REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
  remote: ssh://root@<%= ENV['SERVER_IP'] %>
  cache:
    type: gha

env:
  secret:
    - SESSION_SECRET_KEY
    - SENTRY_DSN
    - OPENROUTER_API_KEY

volumes:
  - "/root/linkboard-db:/app/db"
